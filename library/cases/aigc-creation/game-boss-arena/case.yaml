    arena: { zh: 暴雨中的圆形水下神殿战场，黑色石柱、积水地面与远处瀑布围合空间, en: A circular flooded temple arena in heavy rain, enclosed by black stone pillars, reflective water, and distant waterfalls. }
    attack_cue: { zh: 首领胸口青蓝核心蓄能、双翼燃起橙色光轨，水面形成向玩家扩散的冲击波, en: The cyan chest core charges while orange wing trails ignite and a shockwave spreads across the water toward the player. }
